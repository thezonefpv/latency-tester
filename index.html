<html>
<body>
	<div id="main"></div>
</body>

<script>
let isVertical = true;

setInterval(() => {
	const main = document.getElementById("main");

	if (isVertical) {
		// Horizontal bars
		main.style.backgroundImage =
			"repeating-linear-gradient(to bottom, #000 0px, #000 100px, #000 100px, #000 200px)";
	} else {
		// Vertical bars
		main.style.backgroundImage =
			"repeating-linear-gradient(to right, #000 0px, #000 100px, #fff 100px, #fff 200px)";
	}

	isVertical = !isVertical;
}, 123);
</script>

<style>
	#main {
		width: 100vw;
		height: 100vh;
		background-image: repeating-linear-gradient(
			to right,
			#000 0px,
			#000 100px,
			#fff 100px,
			#fff 200px
		);
	}
</style>
</html>
